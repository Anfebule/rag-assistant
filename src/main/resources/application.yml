spring:
  application:
    name: rag-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  ai:
    chat:
      client:
        observations:
          include-input: true
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5

    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        host: localhost
        port: 5432
        database: ragdb
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        index-type: HNSW
        dimensions: 768  # nomic-embed-text generate 768 dimension vectors
        initialize-schema: true
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true